# MyRemote TURN Server - Production Configuration
# Coturn configuration for WebRTC NAT traversal

# Listening ports
listening-port=3478
tls-listening-port=5349

# Relay ports range (for media)
min-port=49152
max-port=65535

# Server fingerprint (for TLS)
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Realm (must match domain)
realm=myremote.woutils.com

# Server name
server-name=turn.myremote.woutils.com

# Use static-auth-secret for dynamic credentials
# This secret MUST match TURN_SECRET in .env.prod
use-auth-secret
static-auth-secret=__TURN_SECRET__

# Total bandwidth quota per allocation (MB/s)
max-bps=3000000

# User quota (max 10 sessions per user)
user-quota=10

# Total allocation quota
total-quota=100

# Disable UDP relay endpoints (use TCP/TLS only for better firewall traversal)
# Uncomment if you want TCP-only mode
# no-udp-relay

# Enable TLS
cert=/etc/letsencrypt/live/myremote.woutils.com/fullchain.pem
pkey=/etc/letsencrypt/live/myremote.woutils.com/privkey.pem

# Cipher suites (TLS 1.2+)
cipher-list="ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384"

# Disable weak ciphers
no-sslv3
no-tlsv1
no-tlsv1_1

# External IP (public IP of VPS)
# This will be auto-detected, but can be set manually
# external-ip=YOUR_VPS_PUBLIC_IP

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Prometheus metrics endpoint
prometheus
prometheus-port=9641

# Security: Prevent loopback peers (no relay to localhost)
no-loopback-peers

# Security: Deny private IP ranges in relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Disable CLI (no telnet access)
no-cli

# Process user/group
proc-user=turnserver
proc-group=turnserver

# PID file
pidfile=/var/run/turnserver/turnserver.pid

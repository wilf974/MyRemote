# MyRemote - Nginx Reverse Proxy Configuration
# Domain: myremote.woutils.com
# Location: /etc/nginx/sites-available/myremote.conf

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name myremote.woutils.com api.myremote.woutils.com auth.myremote.woutils.com monitoring.myremote.woutils.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main Web UI (myremote.woutils.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myremote.woutils.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/myremote.woutils.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myremote.woutils.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myremote.woutils.com/chain.pem;

    # SSL Security (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Access Logs
    access_log /var/log/nginx/myremote-web-access.log;
    error_log /var/log/nginx/myremote-web-error.log;

    # Proxy to Next.js Web Container
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# API Backend (api.myremote.woutils.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.myremote.woutils.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/myremote.woutils.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myremote.woutils.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myremote.woutils.com/chain.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/myremote-api-access.log;
    error_log /var/log/nginx/myremote-api-error.log;

    # Proxy to NestJS API Container
    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (plus longs pour WebSocket)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket Support
        proxy_buffering off;
    }

    # Increase body size for file uploads (10GB max)
    client_max_body_size 10G;
}

# Keycloak Auth (auth.myremote.woutils.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.myremote.woutils.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/myremote.woutils.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myremote.woutils.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myremote.woutils.com/chain.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/myremote-auth-access.log;
    error_log /var/log/nginx/myremote-auth-error.log;

    # Proxy to Keycloak Container
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Increase body size
    client_max_body_size 20M;
}


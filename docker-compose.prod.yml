# MyRemote - Docker Compose Production
# Déploiement sur VPS avec nginx reverse proxy
# Domain: myremote.woutils.com

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: myremote-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myremote}
      POSTGRES_USER: ${POSTGRES_USER:-myremote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - myremote-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myremote}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: myremote-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - myremote-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Keycloak (OIDC + 2FA)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: myremote-keycloak-prod
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myremote}
      KC_DB_USERNAME: ${POSTGRES_USER:-myremote}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: auth.${DOMAIN:-myremote.woutils.com}
      KC_PROXY: edge
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_LOG_LEVEL: INFO
    command: start
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myremote-internal
      - myremote-public
    labels:
      - "traefik.enable=false"  # Nginx gère le reverse proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Backend (NestJS)
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: myremote/api:latest
    container_name: myremote-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-myremote}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-myremote}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KEYCLOAK_URL: https://auth.${DOMAIN:-myremote.woutils.com}
      KEYCLOAK_REALM: myremote
      KEYCLOAK_CLIENT_ID: myremote-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 15m
      REFRESH_TOKEN_EXPIRATION: 7d
      TURN_URL: turn:${DOMAIN:-myremote.woutils.com}:3478
      TURN_SECRET: ${TURN_SECRET}
      CORS_ORIGINS: https://${DOMAIN:-myremote.woutils.com},https://auth.${DOMAIN:-myremote.woutils.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myremote-internal
      - myremote-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-myremote.woutils.com}
        NEXT_PUBLIC_WS_URL: wss://api.${DOMAIN:-myremote.woutils.com}
        NEXT_PUBLIC_KEYCLOAK_URL: https://auth.${DOMAIN:-myremote.woutils.com}
    image: myremote/web:latest
    container_name: myremote-web-prod
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - myremote-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TURN Relay (coturn)
  turn:
    image: coturn/coturn:latest
    container_name: myremote-turn-prod
    restart: always
    network_mode: host  # Nécessaire pour TURN (UDP)
    environment:
      TURNSERVER_ENABLED: 1
    volumes:
      - ./infra/coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: myremote-prometheus-prod
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    volumes:
      - ./infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - myremote-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: myremote-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitoring.${DOMAIN:-myremote.woutils.com}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - myremote-internal
      - myremote-public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Loki (Logs)
  loki:
    image: grafana/loki:latest
    container_name: myremote-loki-prod
    restart: always
    volumes:
      - ./infra/loki/loki-prod-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - myremote-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  myremote-internal:
    driver: bridge
    internal: true
  myremote-public:
    driver: bridge

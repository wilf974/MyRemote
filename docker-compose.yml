# MyRemote - Docker Compose (Development)
# Usage: docker-compose up -d

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: myremote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myremote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - myremote

  # Redis Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: myremote-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - myremote

  # Keycloak (OIDC + 2FA)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: myremote-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443
      KC_LOG_LEVEL: INFO
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - myremote

  # TURN Relay (coturn)
  turn:
    image: coturn/coturn:latest
    container_name: myremote-turn
    restart: unless-stopped
    network_mode: host  # Nécessaire pour TURN (UDP)
    environment:
      TURNSERVER_ENABLED: 1
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Ports (host mode):
    # - 3478:3478/udp  # STUN/TURN
    # - 3478:3478/tcp  # STUN/TURN (TCP)
    # - 5349:5349/tcp  # TURNS (TLS)
    # - 49152-65535:49152-65535/udp  # TURN relay

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: myremote-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - myremote

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: myremote-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - myremote

  # Loki (Logs)
  loki:
    image: grafana/loki:latest
    container_name: myremote-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - myremote

  # Vault (Secrets Management) - Optional
  # vault:
  #   image: hashicorp/vault:latest
  #   container_name: myremote-vault
  #   restart: unless-stopped
  #   environment:
  #     VAULT_DEV_ROOT_TOKEN_ID: myroot
  #     VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
  #   ports:
  #     - "8200:8200"
  #   cap_add:
  #     - IPC_LOCK
  #   networks:
  #     - myremote

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  myremote:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
